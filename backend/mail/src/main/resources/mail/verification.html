<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIBE · {{action}}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f3f4fa; color: #3c3c46; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; -webkit-text-size-adjust: 100%;">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; mso-hide: all;">一封来自 VIBE 的小小来信。完成{{action}}，验证码将在5分钟后失效。</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f3f4fa">
      <tr>
        <td align="center" style="padding: 28px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 560px;">
            <tr>
              <td style="padding: 0 8px 24px;">
                <div style="font-size: 22px; font-weight: 600; letter-spacing: 5px; color: #4c648e;">VIBE</div>
                <div style="margin-top: 8px; font-size: 12px; line-height: 20px; letter-spacing: 2px; color: #767180;">日记 · 音乐 · 诗词</div>
              </td>
            </tr>
            <tr>
              <td bgcolor="#ffffff" style="background-color: #ffffff; border: 1px solid #e5e3ef; border-radius: 20px; overflow: hidden;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td bgcolor="#c9e0fa" style="padding: 0; background-color: #c9e0fa; border-radius: 20px 20px 0 0;">
                      <img src="cid:vibe-sky" width="560" alt="VIBE 的蓝发双辫少女，与你共享一片晴空" style="display: block; width: 100%; max-width: 560px; height: auto; border: 0; border-radius: 20px 20px 0 0; color: #425d88; font-size: 13px; line-height: 24px;" />
                    </td>
                  </tr>
                  <tr>
                    <td bgcolor="#f4f7fd" style="padding: 12px 24px; background-color: #f4f7fd; border-bottom: 1px solid #e5ebf6;">
                      <p style="margin: 0; font-size: 12px; line-height: 22px; letter-spacing: 1px; color: #6681a9;">晴空捎来一封信，与你的日常相遇。</p>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 26px 24px;">
                      <p style="margin: 0 0 12px; font-size: 10px; line-height: 18px; letter-spacing: 3px; color: #876477;">A LITTLE LETTER FOR YOU</p>
                      <h1 style="margin: 0 0 16px; font-size: 26px; line-height: 38px; font-weight: 500; color: #3c3c46;">{{action}}</h1>
                      <p style="margin: 0 0 20px; font-size: 14px; line-height: 26px; color: #65718a;">你好，验证码已经送达。<br />请回到刚才的页面，输入下方数字完成{{action}}。</p>
                      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                        <tr>
                          <td align="center" bgcolor="#eff4fc" style="padding: 17px 8px; border: 1px solid #dfe6f3; border-radius: 12px; background-color: #eff4fc; background-image: linear-gradient(115deg, #edf5ff, #f6eff8);">
                            <div style="font-size: 12px; line-height: 20px; color: #746a83;">你的验证码</div>
                            <div style="margin: 8px 0; font-family: Consolas, 'Courier New', monospace; font-size: 32px; font-weight: 700; line-height: 44px; letter-spacing: 5px; color: #4e6897; white-space: nowrap;">{{code}}</div>
                            <div style="font-size: 12px; line-height: 20px; color: #746a83;">5 分钟内有效</div>
                          </td>
                        </tr>
                      </table>
                      <p style="margin: 20px 0 0; font-size: 12px; line-height: 23px; color: #748098;">小小提醒：请勿向他人透露验证码。<br />如果这不是你的操作，忽略此邮件即可。</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 24px 12px 0;">
                <p style="margin: 0 0 8px; font-size: 13px; line-height: 22px; color: #876477;">留住片刻，听见生活。</p>
                <p style="margin: 0; font-size: 11px; line-height: 20px; color: #767180;">此邮件由 VIBE 自动发送，请勿直接回复。</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
