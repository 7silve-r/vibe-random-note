admin:
  password: ${ADMIN_PASSWORD:}

server:
  address: 127.0.0.1
  port: ${APP_PORT:8081}
  tomcat:
    max-swallow-size: 55MB

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/vibe_random_note?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

file:
  access-url-prefix: ${UPLOAD_URL_PREFIX:/uploads/}

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:vibe-music-data}
  private-bucket: ${MINIO_PRIVATE_BUCKET:vibe-diary-private}
