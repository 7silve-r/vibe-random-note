spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
admin:
  enabled: false
jwt:
  secret: test-only-secret-0123456789abcdef0123456789
minio:
  accessKey: test-access
  secretKey: test-secret-key
